<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botler Sales HQ · My prospects</title>
<link rel="stylesheet" href="assets/hq.css">
<style>
  .stage { max-width: 1180px; margin: 0 auto; padding: 46px 34px 70px; min-height: 100vh; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; flex-wrap: wrap; animation: rise .5s .08s both; }
  h1 { font-size: clamp(40px, 6vw, 58px); font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 30px 0 8px; color: var(--ink-strong); }
  .score { color: var(--grey); font-size: 15px; margin: 0 0 6px; line-height: 1.6; }
  .score b { color: var(--ink-strong); }
  .score .hot { color: var(--orange); font-weight: 700; }
  .add { width: auto; padding: 15px 26px; font-size: 16px; margin-bottom: 8px; white-space: nowrap; }

  #addForm {
    display: none; gap: 12px; flex-wrap: wrap; align-items: center;
    border: 1.5px dashed var(--border); border-radius: 8px; background: var(--panel);
    padding: 16px; margin-top: 22px; animation: rise .4s both;
  }
  #addForm input { flex: 1; min-width: 150px; background: var(--paper); }
  #addForm .ok { padding: 11px 18px; font-weight: 800; }

  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 34px; animation: rise .5s .16s both; }
  @media (max-width: 950px) { .board { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .board { grid-template-columns: 1fr; } }

  .col .chead {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--ink-strong); font-size: 12.5px; font-weight: 700;
    background: var(--bar-bg); border: 1.5px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 6px;
  }
  .col .chead .n { color: var(--paper); background: var(--ink); border-radius: 999px; min-width: 22px; height: 22px; display: grid; place-items: center; font-size: 11px; }
  .col.trophy .chead { background: #fdf3d1; border-color: var(--gold); color: var(--gold); }
  .col.trophy .chead .n { background: var(--gold); }
  .col .cdesc { color: var(--grey); font-size: 12px; line-height: 1.5; margin: 0 2px 14px; }

  .card { background: var(--panel); border: 1.5px solid var(--border); border-radius: 8px; padding: 14px 26px 12px 14px; margin-bottom: 14px; position: relative; animation: slidein .4s both; }
  .del {
    position: absolute; top: 6px; right: 7px; background: none; border: none;
    color: var(--faint); font-size: 13px; padding: 4px 6px; border-radius: 6px;
  }
  .del:hover { color: var(--ink); background: var(--bar-bg); }
  .del.arm { color: var(--paper); background: var(--ink); font-size: 10.5px; font-weight: 700; }
  .card .who { font-size: 15px; font-weight: 750; letter-spacing: -.01em; color: var(--ink-strong); }
  .card .who a { text-decoration: none; }
  .card .who a:hover { color: var(--gold); }
  .card .what { font-size: 12.5px; color: var(--grey); margin-top: 3px; }
  .card .wait { font-size: 11.5px; color: var(--faint); margin-top: 8px; }
  .card .wait .nudge { color: var(--orange); }
  .card .acts { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
  .up { font-size: 12.5px; font-weight: 750; padding: 7px 12px; background: var(--paper); color: var(--ink); border: 1.5px solid var(--border); border-radius: 6px; box-shadow: 2px 2px 0 var(--shadow); transition: transform .08s ease, box-shadow .08s ease; }
  .up:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
  .up:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--shadow); }
  .no { font-size: 12px; background: none; border: none; color: var(--faint); text-decoration: underline; padding: 7px 4px; }
  .no:hover { color: var(--orange); }
  .col.trophy .card { background: linear-gradient(150deg, var(--panel), #fdf6dd); box-shadow: 3px 3px 0 var(--gold); }
  .col.trophy .card .who::after { content: " 🏆"; }
  .empty { border: 1.5px dashed var(--faint); border-radius: 8px; color: var(--faint); font-size: 12.5px; text-align: center; padding: 22px 12px; line-height: 1.5; }

  #clientParty {
    position: fixed; inset: 0; z-index: 70; display: none; place-items: center;
    background: rgba(255,255,255,.9); backdrop-filter: blur(4px); text-align: center; padding: 20px;
  }
  #clientParty .in { animation: pop .6s ease both; }
  #clientParty .big { font-size: clamp(44px, 9vw, 76px); font-weight: 800; letter-spacing: -.04em; }
  #clientParty p { color: var(--grey); font-size: 16px; margin: 12px 0 28px; }
  #clientParty .go { width: auto; padding: 15px 30px; font-size: 17px; }

  .foot { margin-top: 46px; animation: rise .5s .3s both; }
</style>
</head>
<body>
<div class="stage">
  <div class="meta mono"><span><a href="index.html">← Home</a></span><span>Botler Sales HQ · My prospects</span></div>

  <div class="top">
    <div>
      <h1>Your <em>little world</em></h1>
      <p class="score" id="score"></p>
    </div>
    <button class="go add" onclick="toggleAdd()">Add a prospect +</button>
  </div>

  <div id="addForm">
    <input class="hq" placeholder="Business name" id="fName">
    <input class="hq" placeholder="Trade: pizzeria, bakery, club…" id="fTrade">
    <input class="hq" placeholder="City" id="fCity">
    <input class="hq" placeholder="Website (optional · empty = no site yet 🎯)" id="fSite">
    <input class="hq" placeholder="LinkedIn link (optional)" id="fLi">
    <input class="hq" placeholder="Email (optional)" id="fEm">
    <button class="tool ok" onclick="add()">Add ✔ +5</button>
  </div>

  <div class="board" id="board"></div>

  <div class="foot">
    <div class="mono">Sell with heart · every name here is a future story</div>
    <div class="footlinks mono">
      <button onclick="HQ.exportData()" title="Full backup file · use Restore on the Home page to load it back">💾 Backup (for Restore)</button>
      <button onclick="HQ.exportCSV()" title="Opens in Excel or Google Sheets">📊 Excel / Sheets</button>
    </div>
  </div>
</div>

<div id="clientParty">
  <div class="in">
    <div class="big">CLIENT! <em>You did it</em> 🏆</div>
    <p id="partyMsg"></p>
    <button class="go" onclick="closeParty()">Back to the board ▶</button>
  </div>
</div>

<script src="assets/hq.js"></script>
<script>
  HQ.ensureDay();
  const LEVELS = [
    { label: '01 · CONTACTED',  desc: 'You said hi. Waiting for a reply.',           up: '↗ They replied! → Interested +20' },
    { label: '02 · INTERESTED', desc: 'They replied. Curious, asking questions.',    up: '↗ Demo booked! → Demo +20' },
    { label: '03 · DEMO',       desc: 'A demo is booked or already done.',           up: '🏆 They said YES! → Client +20' },
    { label: '04 · CLIENT 🏆',  desc: 'They said yes. You sold with heart.',         up: null },
  ];

  function render() {
    const st = HQ.state;
    document.getElementById('board').innerHTML = LEVELS.map((L, li) => {
      const cards = st.prospects.filter(p => p.level === li);
      return '<div class="col ' + (li === 3 ? 'trophy' : '') + '">'
        + '<div class="chead mono"><span>' + L.label + '</span><span class="n">' + cards.length + '</span></div>'
        + '<p class="cdesc">' + L.desc + '</p>'
        + (cards.map(p => {
            const quiet = p.lastTouch ? HQ.daysBetween(p.lastTouch, HQ.today()) : null;
            const wait = li === 3 ? 'won · ' + (p.lastTouch ? HQ.nice(p.lastTouch) : '') + ' 🎉'
              : !p.helloSent ? 'in your book · say hi when ready'
              : quiet === 0 ? 'touched today ✨'
              : quiet + ' day' + (quiet > 1 ? 's' : '') + ' quiet' + (quiet >= 3 && li < 3 ? ' · <span class="nudge">🌙 needs a nudge</span>' : '');
            return '<div class="card">'
              + '<button class="del" onclick="del(this,' + p.id + ')" title="Remove from your book (a test, a mistake). No points lost.">✕</button>'
              + '<div class="who"><a href="prospect.html?id=' + p.id + '">' + HQ.esc(p.name) + '</a></div>'
              + '<div class="what">' + HQ.esc(p.trade) + ' · ' + HQ.esc(p.city) + (p.website ? '' : ' · no site yet 🎯') + '</div>'
              + '<div class="wait mono">' + wait + '</div>'
              + (li < 3 ? '<div class="acts">'
                  + '<button class="up" onclick="up(' + p.id + ')">' + L.up + '</button>'
                  + '<button class="no" onclick="no(' + p.id + ')" title="They said no, that is +15 courage points">🦁 no +15</button>'
                  + '</div>' : '')
              + '</div>';
          }).join('') || '<div class="empty">Nobody here yet.<br>Your next move fills this box ✨</div>')
        + '</div>';
    }).join('');

    const total = st.prospects.length;
    const close = st.prospects.filter(p => p.level === 2).length;
    document.getElementById('score').innerHTML =
      '<b>' + total + '</b> friend' + (total > 1 ? 's' : '') + ' in your book'
      + (close ? ' · <span class="hot">' + close + ' getting close 🔥</span>' : '')
      + (st.clients ? ' · <b>' + st.clients + '</b> client' + (st.clients > 1 ? 's' : '') + ' won 🏆' : '');
  }

  function toggleAdd() {
    const f = document.getElementById('addForm');
    f.style.display = f.style.display === 'flex' ? 'none' : 'flex';
    if (f.style.display === 'flex') document.getElementById('fName').focus();
  }
  function add() {
    const name = document.getElementById('fName').value.trim();
    if (!name) { HQ.toast('A name is all I need to start 🙂'); return; }
    const p = HQ.addProspect({
      name,
      trade: document.getElementById('fTrade').value.trim(),
      city: document.getElementById('fCity').value.trim(),
      website: document.getElementById('fSite').value.trim(),
      linkedin: document.getElementById('fLi').value.trim(),
      email: document.getElementById('fEm').value.trim(),
    });
    ['fName','fTrade','fCity','fSite','fLi','fEm'].forEach(id => document.getElementById(id).value = '');
    toggleAdd();
    HQ.toast('+5 points ✨ Welcome, ' + p.name + '!');
    HQ.confetti(8);
    render();
  }
  function up(id) {
    const p = HQ.moveUp(id);
    if (!p) return;
    if (p.level === 3) {
      document.getElementById('partyMsg').textContent = p.name + ' said YES. Client number ' + HQ.state.clients + '. You sold with heart.';
      document.getElementById('clientParty').style.display = 'grid';
      HQ.confetti(60);
    } else {
      HQ.toast('+20 points ✨ ' + p.name + ' moved up!');
      HQ.confetti(12);
    }
    render();
  }
  function no(id) {
    HQ.braveNo(id);
    HQ.toast('+15 courage points 🦁 A no beats silence.');
    HQ.confetti(8);
    render();
  }
  function closeParty() { document.getElementById('clientParty').style.display = 'none'; }
  function del(btn, id) {
    if (!btn.classList.contains('arm')) {          // premier clic : on demande confirmation
      btn.classList.add('arm');
      btn.textContent = 'remove?';
      setTimeout(() => { btn.classList.remove('arm'); btn.textContent = '✕'; }, 2600);
      return;
    }
    HQ.removeProspect(id);
    HQ.toast('Removed from your book 🧹 (no points lost)');
    render();
  }

  render();
</script>
</body>
</html>
